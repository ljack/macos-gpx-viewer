name: Trace
options:
  bundleIdPrefix: fi.lietolahti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 25C9H9N953
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Trace:
    type: application
    platform: macOS
    sources:
      - path: Trace
        excludes: ["Info.plist", "Trace.entitlements"]
    entitlements:
      path: Trace/Trace.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
    info:
      path: Trace/Info.plist
      properties:
        CFBundleName: Trace
        CFBundleDisplayName: Trace
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.navigation
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Jarkko Lietolahti"
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS Exchange Format
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.lietolahti.Trace
        PRODUCT_NAME: Trace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
